description: ADI ADF702X 802.15.4 wireless transceiver

compatible: "adi,adf702x"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array

  channel-frequency:
    type: int
    default: 896000000
    description: |
      Default channel frequency to use for the transceiver.

  adf7024,radio-profile:
    type: int
    default: 0
    description: |
      Default radio profile for the ADF7024

  adf702x,pa-level:
    type: string
    default: "13.5"
    description: |
      Power Amplifier (PA) level in dBm [-15; 13.5]

  adf702x,ext-pa-en:
    type: boolean
    description: |
      1:
        external PA enable signal on ATB3 is enabled. The signal is logic high
        while the ADF7023 is in the PHY_TX state and logic low while in any
        other nonsleep state.
      0:
        external PA enable signal on ADCIN_ATB3 is disabled.

  adf702x,sport-mode:
    type: int
    default: 0
    description: |
      0: Packet mode enabled.
      1: |
        Sport mode enabled. GP4 interrupt enabled on preamble detection.
        Rx data enabled on preamble detection.
      2: |
        Sport mode enabled. GP4 interrupt enabled on sync word detection.
        Rx data enabled on preamble detection.
